version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: mondje_db
    environment:
      POSTGRES_USER: mondje_user
      POSTGRES_PASSWORD: mondje_password
      POSTGRES_DB: mondje
    ports:
      - "5432:5432"
    volumes:
      - mondje_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: mondje_backend
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      - DB_URL=postgres://mondje_user:mondje_password@db:5432/mondje?sslmode=disable
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 256M
    depends_on:
      - db

volumes:
  mondje_postgres_data:
  